# AAPD — Phase 3 (standalone Hetero-GCN + Label Correlation Matrix + ensemble)
#
# Design notes:
#   1. The graph model trains STANDALONE (no Phase-2 fusion during training),
#      so it cannot shortcut to copying Phase 2.
#   2. A learnable 54x54 Label Correlation Matrix, initialised from training
#      co-occurrence, models label dependencies explicitly (S-GCN only does so
#      implicitly, via propagation).
#   3. The Phase-2 ensemble happens at TEST time, with the mixing weight fitted
#      on validation.
#
# Full-batch: the whole graph is one forward pass, so batch_size is 1 by
# definition and `epochs` counts full passes over the graph.
#
# Run in order:
#   python scripts/04_build_graph.py           --config configs/aapd_phase3.yaml
#   python scripts/05_compute_node_features.py --config configs/aapd_phase3.yaml
#   python scripts/06_train_phase3.py          --config configs/aapd_phase3.yaml

dataset:
  name: aapd
  num_labels: 54
  train_path: data/aapd/aapd_train.tsv
  val_path:   data/aapd/aapd_validation.tsv
  test_path:  data/aapd/aapd_test.tsv
  max_seq_len: 256

model:
  encoder_name: microsoft/deberta-v3-base
  language: english                 # -> whitespace word tokenization in 04_build_graph.py
  hidden_size: 768
  dropout: 0.1

phase3:
  hidden_dim: 512
  dropout: 0.3
  residual: true
  graph_dir: data/aapd/graph
  features_dir: data/aapd/node_features
  lcm_scale: 0.3                    # initial scale of the label correlation matrix
  window_size: 50                   # PMI sliding window (English, whitespace tokens)
  min_freq: 10                      # minimum word frequency to enter the vocabulary
  phase2:
    checkpoint: outputs/aapd/phase2/best_model.pt
  # Optional second ensemble against Phase 1. Left disabled for AAPD: there are
  # no cached Phase-1 validation scores, so the graph+Phase-1 comparison would
  # be decided on test. Uncomment only for exploration.
  # phase1:
  #   config: configs/aapd_phase1.yaml
  #   checkpoint: outputs/aapd/phase1/best_model.pt

loss:
  name: bce
  class_balanced: true
  cb_beta: 0.999

train:
  seed: 42
  epochs: 2000                      # high ceiling; early stopping decides
  batch_size: 1
  grad_accum_steps: 1
  eval_batch_size: 1
  lr: 0.001
  weight_decay: 0.0001
  warmup_ratio: 0.05
  lr_scheduler: cosine
  fp16: false
  gradient_checkpointing: false
  max_grad_norm: 1.0
  optimizer: adamw
  save_dir: outputs/aapd/phase3
  save_best_metric: val_micro_f1
  log_every: 20
  eval_every_epoch: true
  early_stopping_patience: 100      # stop after 100 epochs with no val improvement

eval:
  threshold: 0.5
  top_k: [1, 3, 5]

# Test-time ensemble of the graph model with Phase 2. The mixing weight is
# grid-searched on VALIDATION over [weight_min, weight_max] at `search_step`.
ensemble:
  weight_min: 0.0
  weight_max: 1.0
  search_step: 0.05                 # validation grid resolution for the mixing weight
