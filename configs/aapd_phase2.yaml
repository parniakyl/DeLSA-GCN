# AAPD — Phase 2 (encoder + LSA + gated fusion + EMA)
#
# `ema_decay` keeps a running average of the weights, which is evaluated as a
# third candidate next to best-on-val and last-epoch. Useful when val micro-F1
# peaks early but test keeps improving. The REPORTED number is still
# best-on-val — selecting on test would be leakage.
#
# Prerequisite:
#   python scripts/02_encode_labels.py --dataset aapd \
#       --encoder microsoft/deberta-v3-base \
#       --output data/aapd/label_embeddings.pt
#
# Run: python scripts/03_train_phase2.py --config configs/aapd_phase2.yaml

dataset:
  name: aapd
  num_labels: 54
  train_path: data/aapd/aapd_train.tsv
  val_path:   data/aapd/aapd_validation.tsv
  test_path:  data/aapd/aapd_test.tsv
  max_seq_len: 256

model:
  encoder_name: microsoft/deberta-v3-base
  language: english
  hidden_size: 768
  dropout: 0.1
  head: lsa_gated                          # marks this as a Phase-2 config
  freeze_layers: 0
  label_emb_path: data/aapd/label_embeddings.pt   # output of 02_encode_labels.py
  freeze_label_emb: false

loss:
  name: bce
  class_balanced: true
  cb_beta: 0.999

train:
  seed: 42
  epochs: 15
  batch_size: 8
  grad_accum_steps: 4               # effective batch = 32
  eval_batch_size: 16
  lr: 2.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.1
  lr_scheduler: cosine
  fp16: true
  gradient_checkpointing: true
  max_grad_norm: 1.0
  optimizer: adamw
  ema_decay: 0.99                   # 0 disables the EMA candidate
  save_dir: outputs/aapd/phase2
  save_best_metric: val_micro_f1
  log_every: 100
  eval_every_epoch: true

eval:
  threshold: 0.5
  top_k: [1, 3, 5]
