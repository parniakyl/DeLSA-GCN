# RMSC-V2 — Phase 3 (standalone Hetero-GCN + LCM + ensemble)
#
# hidden_dim is 256 rather than AAPD's 512: the RMSC graph is large enough that
# 512 did not fit in 8 GB.
#
# Run in order:
#   python scripts/04_build_graph.py           --config configs/rmsc_phase3.yaml
#   python scripts/05_compute_node_features.py --config configs/rmsc_phase3.yaml
#   python scripts/06_train_phase3.py          --config configs/rmsc_phase3.yaml

dataset:
  name: rmsc
  num_labels: 22
  train_path: data/rmsc/train.tsv
  val_path:   data/rmsc/val.tsv
  test_path:  data/rmsc/test.tsv
  max_seq_len: 384

model:
  encoder_name: hfl/chinese-roberta-wwm-ext
  language: chinese                 # -> WordPiece word tokenization in 04_build_graph.py
  hidden_size: 768
  dropout: 0.1

phase3:
  hidden_dim: 256                   # reduced from 512 for memory
  dropout: 0.3
  residual: true
  graph_dir: data/rmsc/rmsc_cn_graph
  features_dir: data/rmsc/rmsc_cn_node_features
  lcm_scale: 0.3
  window_size: 20                   # PMI window over Chinese word-level tokens
  min_freq: 3                       # Chinese vocabulary is smaller than English
  phase2:
    checkpoint: outputs/rmsc/phase2/best_model.pt
  phase1:
    config: configs/rmsc_phase1.yaml
    checkpoint: outputs/rmsc/phase1/best_model.pt

loss:
  name: bce
  class_balanced: true
  cb_beta: 0.999

train:
  seed: 42
  epochs: 2000
  batch_size: 1
  grad_accum_steps: 1
  eval_batch_size: 1
  lr: 0.0005
  weight_decay: 0.0001
  warmup_ratio: 0.05
  lr_scheduler: cosine
  fp16: false
  gradient_checkpointing: false
  max_grad_norm: 1.0
  optimizer: adamw
  save_dir: outputs/rmsc/phase3
  save_best_metric: val_micro_f1
  log_every: 50
  eval_every_epoch: true
  early_stopping_patience: 200

eval:
  threshold: 0.5
  top_k: [1, 3, 5]

# Test-time ensemble of the graph model with Phase 2. The mixing weight is
# grid-searched on VALIDATION over [weight_min, weight_max] at `search_step`.
ensemble:
  weight_min: 0.0
  weight_max: 1.0
  search_step: 0.05                 # validation grid resolution for the mixing weight
