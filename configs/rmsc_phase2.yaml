# RMSC-V2 — Phase 2 (Chinese encoder + LSA + gated fusion)
#
# Prerequisite:
#   python scripts/02_encode_labels.py --dataset rmsc \
#       --encoder hfl/chinese-roberta-wwm-ext \
#       --output data/rmsc/rmsc_cn_label_embeddings.pt
#
# Run: python scripts/03_train_phase2.py --config configs/rmsc_phase2.yaml

dataset:
  name: rmsc
  num_labels: 22
  train_path: data/rmsc/train.tsv
  val_path:   data/rmsc/val.tsv
  test_path:  data/rmsc/test.tsv
  max_seq_len: 384

model:
  encoder_name: hfl/chinese-roberta-wwm-ext
  language: chinese
  hidden_size: 768
  dropout: 0.1
  head: lsa_gated
  freeze_layers: 0
  label_emb_path: data/rmsc/rmsc_cn_label_embeddings.pt   # output of 02_encode_labels.py
  freeze_label_emb: false

loss:
  name: bce
  class_balanced: true
  cb_beta: 0.999

train:
  seed: 42
  epochs: 20
  batch_size: 4
  grad_accum_steps: 8               # effective batch = 32
  eval_batch_size: 8
  lr: 2.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.1
  lr_scheduler: cosine
  fp16: true
  gradient_checkpointing: true
  max_grad_norm: 1.0
  optimizer: adamw
  ema_decay: 0.99
  save_dir: outputs/rmsc/phase2
  save_best_metric: val_micro_f1
  log_every: 50
  eval_every_epoch: true

eval:
  threshold: 0.5
  top_k: [1, 3, 5]
