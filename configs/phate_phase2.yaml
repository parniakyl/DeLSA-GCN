# PHATE (Persian) — Phase 2 (Persian encoder + LSA + gated fusion)
#
# Prerequisite:
#   python scripts/02_encode_labels.py --dataset phate \
#       --encoder HooshvareLab/roberta-fa-zwnj-base \
#       --output data/phate/phate_label_embeddings.pt
#
# Run: python scripts/03_train_phase2.py --config configs/phate_phase2.yaml

dataset:
  name: phate
  num_labels: 4
  train_path: data/phate/train.tsv
  val_path:   data/phate/val.tsv
  test_path:  data/phate/test.tsv
  max_seq_len: 128

model:
  encoder_name: HooshvareLab/roberta-fa-zwnj-base
  language: persian
  hidden_size: 768
  dropout: 0.1
  head: lsa_gated
  freeze_layers: 0
  label_emb_path: data/phate/phate_label_embeddings.pt   # output of 02_encode_labels.py
  freeze_label_emb: false

loss:
  name: bce
  class_balanced: true
  cb_beta: 0.999

train:
  seed: 42
  epochs: 15
  batch_size: 16
  grad_accum_steps: 2               # effective batch = 32
  eval_batch_size: 32
  lr: 2.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.1
  lr_scheduler: cosine
  fp16: true
  gradient_checkpointing: false
  max_grad_norm: 1.0
  optimizer: adamw
  ema_decay: 0.99
  save_dir: outputs/phate/phase2
  save_best_metric: val_micro_f1
  log_every: 50
  eval_every_epoch: true

eval:
  threshold: 0.5
  top_k: [1, 3, 5]
