# PHATE (Persian) — Phase 3 (standalone Hetero-GCN + LCM + ensemble)
#
# hidden_dim is only 256: with 4 labels and a small corpus, a wider graph model
# just overfits.
#
# Run in order:
#   python scripts/04_build_graph.py           --config configs/phate_phase3.yaml
#   python scripts/05_compute_node_features.py --config configs/phate_phase3.yaml
#   python scripts/06_train_phase3.py          --config configs/phate_phase3.yaml

dataset:
  name: phate
  num_labels: 4
  train_path: data/phate/train.tsv
  val_path:   data/phate/val.tsv
  test_path:  data/phate/test.tsv
  max_seq_len: 128

model:
  encoder_name: HooshvareLab/roberta-fa-zwnj-base
  language: persian                 # -> WordPiece word tokenization in 04_build_graph.py
  hidden_size: 768
  dropout: 0.1

phase3:
  hidden_dim: 256                   # small dataset (4 labels) -> small model
  dropout: 0.3
  residual: true
  graph_dir: data/phate/phate_graph
  features_dir: data/phate/phate_node_features
  lcm_scale: 0.3
  window_size: 20
  min_freq: 3
  phase2:
    checkpoint: outputs/phate/phase2/best_model.pt
  phase1:
    config: configs/phate_phase1.yaml
    checkpoint: outputs/phate/phase1/best_model.pt

loss:
  name: bce
  class_balanced: true
  cb_beta: 0.999

train:
  seed: 42
  epochs: 2000
  batch_size: 1
  grad_accum_steps: 1
  eval_batch_size: 1
  lr: 0.001
  weight_decay: 0.0001
  warmup_ratio: 0.05
  lr_scheduler: cosine
  fp16: false
  gradient_checkpointing: false
  max_grad_norm: 1.0
  optimizer: adamw
  save_dir: outputs/phate/phase3
  save_best_metric: val_micro_f1
  log_every: 20
  eval_every_epoch: true
  early_stopping_patience: 100

eval:
  threshold: 0.5
  top_k: [1, 3, 5]

# Test-time ensemble of the graph model with Phase 2. The mixing weight is
# grid-searched on VALIDATION over [weight_min, weight_max] at `search_step`.
ensemble:
  weight_min: 0.0
  weight_max: 1.0
  search_step: 0.05                 # validation grid resolution for the mixing weight
